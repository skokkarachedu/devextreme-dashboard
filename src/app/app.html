<div class="dashboard-toolbar">

  <dx-button class="control-btn"(onClick)="addWidget()"><span>+ Add Widget</span></dx-button>
  <dx-select-box
    [items]="timeRanges"
    [(value)]="selectedRange">
  </dx-select-box>
</div>

<gridster [options]="options">
  <gridster-item *ngFor="let item of dashboardItems" [item]="item">
    <ng-container [ngSwitch]="item.type">
      <dx-chart *ngSwitchCase="'chart'" [dataSource]="item.data">
        <dxi-series argumentField="time" valueField="value" type="line"></dxi-series>
      </dx-chart>

      <dx-data-grid *ngSwitchCase="'table'" [dataSource]="item.data" [showBorders]="true">
        <dxi-column dataField="name" caption="Metric"></dxi-column>
        <dxi-column dataField="value" caption="Value"></dxi-column>
        <dxi-column dataField="status" caption="Status"></dxi-column>
      </dx-data-grid>

      <div *ngSwitchCase="'info'" class="info-widget">
        <h3>{{ item.title }}</h3>
        <p>{{ item.data }}</p>
      </div>
    </ng-container>
  </gridster-item>
</gridster>
